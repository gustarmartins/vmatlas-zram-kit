name: static-checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3
      - name: Run syntax tests
        run: ./tests/test-syntax.sh
      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh bin/vmatlas-zram libexec/vmatlas-zram-tier-init libexec/vmatlas-zram-tier-manager libexec/vmatlas-zram-mglru tests/test-syntax.sh tests/vm/launch-test-vm.sh
